[project]
name = "tactus"
version = "0.0.0"
description = "Tactus control plane: Work Order lifecycle, scheduling and recovery composition."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tactus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
