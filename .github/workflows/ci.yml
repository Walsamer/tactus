name: ci

on:
  push:
    branches: ["main"]
  pull_request:

# One run per ref: a branch with an open PR is validated only by the
# pull_request event, and a rapid re-push cancels the superseded run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Exact reviewed Ictus revision. The conformance harness re-verifies the
  # checkout HEAD and fails visibly on any mismatch; the workflow also checks it
  # explicitly before any build runs.
  ICTUS_REPOSITORY: Walsamer/ictus
  ICTUS_COMMIT: 86816d6019af1f23c63428348cd820d706bb0d27

jobs:
  python:
    name: python (pytest + verifier)
    # Pinned, not ``ubuntu-latest``: the floating label migrates to Ubuntu 26
    # from 2026-10-19, which would silently change the verification image.
    runs-on: ubuntu-24.04
    env:
      # Real-boundary conformance reads these; the harness builds the pinned
      # `ictus` binary into the isolated target dir and never touches the
      # canonical checkout's own default target directory.
      TACTUS_ICTUS_ROOT: ${{ github.workspace }}/.ictus
      TACTUS_ICTUS_TARGET_DIR: ${{ github.workspace }}/.ictus/target
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: install (frozen)
        run: uv sync --frozen

      - name: checkout pinned Ictus
        uses: actions/checkout@v7
        with:
          repository: Walsamer/ictus
          ref: 86816d6019af1f23c63428348cd820d706bb0d27
          path: .ictus

      - name: verify pinned Ictus revision
        run: |
          actual="$(git -C .ictus rev-parse HEAD)"
          if [ "$actual" != "$ICTUS_COMMIT" ]; then
            echo "::error::Ictus pin mismatch: expected $ICTUS_COMMIT, found $actual"
            exit 1
          fi
          echo "verified Ictus $ICTUS_REPOSITORY@$actual"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # The conformance build lives in the pinned checkout's own target dir.
          workspaces: .ictus
      - name: fetch pinned Ictus dependencies (enables the harness --offline build)
        run: cargo fetch --locked --manifest-path .ictus/Cargo.toml

      # The real-boundary tests resolve, pin-verify and build the pinned Ictus
      # binary themselves; a missing/off-pin checkout, a build failure or a
      # contract failure fails this step rather than skipping.
      - name: pytest
        run: uv run --frozen pytest -q

      # Human-auditable evidence that the real binary decided the canonical
      # fixtures (INITIAL -> ESCALATE, RECOVERY -> REEXECUTE). Reuses the binary
      # the pytest session built in the isolated target dir.
      - name: real-boundary conformance report
        run: |
          uv run --frozen python integrations/ictus/conformance.py \
            --target-dir "$TACTUS_ICTUS_TARGET_DIR" \
            tests/integrations/ictus/data/initial_snapshot.v2.json \
            tests/integrations/ictus/data/recovery_snapshot.v2.json
      - name: verifier
        run: ./scripts/verify-goal.sh
